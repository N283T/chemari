[project]
name = "molwidgets"
version = "0.1.0"
description = "anywidget-based molecule grid and Morgan fingerprint explorer for marimo notebooks"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anywidget>=0.11",
    "rdkit>=2025.9",
    "traitlets>=5",
]

[dependency-groups]
dev = [
    "marimo>=0.25",
    "polars>=1.30",
    "pandas>=2.3",
    "altair>=5.5",
    "numpy>=2",
    "pytest>=8",
    "ruff>=0.12",
    "ty",
    "lightgbm>=4.7.0",
    "scipy>=1.14",
    "scikit-learn>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/molwidgets"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# marimo cells end with a bare expression (the cell output) and an explicit return
"notebooks/*.py" = ["B018", "PLR1711"]
"dev/*.py" = ["B018", "PLR1711"]
