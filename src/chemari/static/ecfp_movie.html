<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Inside ECFP4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #070a12; --bg1: #0d1424; --fg: #eef1f7; --muted: #8b95ab; --line: #2a3450;
  --amber: #ffb547; --blue: #4dabf7; --red: #ff5d5d; --card: #121a2d;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--fg); overflow: hidden;
  font-family: Inter, system-ui, sans-serif; }
/* the video and its control bar are separate blocks; the bar sits under the frame, on the host page */
#player { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px; }
#viewport { position: relative; overflow: hidden; background: var(--bg0); border-radius: 12px; flex: none; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
#bg, #world, #overlay { position: absolute; inset: 0; width: 1920px; height: 1080px; }
.a { position: absolute; left: 0; top: 0; will-change: transform, opacity; }

/* chips */
.chip { width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
  font: 800 34px Inter, sans-serif; color: #fff; letter-spacing: -.02em;
  box-shadow: 0 10px 28px -6px var(--glow, rgba(0,0,0,.5)), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 0 rgba(0,0,0,.18); }
.chip.grey { filter: grayscale(1) brightness(.75); }
.ecard { width: 150px; height: 236px; border-radius: 18px; background: linear-gradient(180deg, #16203a, #0f172b);
  border: 1px solid #2b3960; box-shadow: 0 20px 40px -20px rgba(0,0,0,.9); display: flex; flex-direction: column; align-items: center; padding-top: 50px; }
.ecard svg { width: 138px; height: 106px; display: block; }
.ecard .rad { font: 600 15px Inter; color: var(--muted); margin-top: 6px; letter-spacing: .04em; }
.num { font: 500 15px "JetBrains Mono", monospace; color: var(--muted); white-space: nowrap; }

/* cards */
.card { width: 420px; height: 70px; border-radius: 16px; background: linear-gradient(180deg, #17213a, #111a2e);
  border: 1px solid #2b3960; display: flex; align-items: center; justify-content: space-between; padding: 0 26px;
  font-size: 24px; color: var(--muted); box-shadow: 0 16px 40px -18px rgba(0,0,0,.8); }
.card b { color: var(--fg); font: 700 32px "JetBrains Mono", monospace; }

.hash { width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; }
.hash svg { position: absolute; inset: 0; }
.hash span { font: 700 24px "JetBrains Mono", monospace; color: #fff; position: relative; }

.pair { height: 84px; padding: 0 16px 0 18px; border-radius: 20px; background: #16203a; border: 1px solid #2d3b63;
  display: flex; align-items: center; gap: 12px; font: 700 40px "JetBrains Mono", monospace; color: var(--amber); }
.pair .chip { width: 52px; height: 52px; font-size: 28px; border-radius: 13px; }
.plus { font: 300 60px Inter; color: var(--muted); }

.stamp { font: 900 30px Inter; color: var(--red); border: 4px solid var(--red); border-radius: 10px; padding: 4px 14px;
  letter-spacing: .08em; background: rgba(255,93,93,.08); white-space: nowrap; }

.slot { width: 92px; height: 120px; border-radius: 18px; border: 2px solid #2d3a5c; background: rgba(18,26,45,.85); }
.slotlbl { font: 500 18px "JetBrains Mono", monospace; color: var(--muted); }
.digit { font: 700 62px "JetBrains Mono", monospace; }

.traylbl { font: 700 18px Inter; letter-spacing: .22em; color: var(--muted); }
.modtxt { font: 500 22px "JetBrains Mono", monospace; color: var(--fg); white-space: nowrap;
  background: rgba(13,20,36,.92); padding: 6px 12px; border-radius: 10px; border: 1px solid #2d3a5c; }

/* captions */
#cap { position: absolute; left: 120px; top: 84px; width: 1100px; }
#cap .tag { font: 700 20px Inter; letter-spacing: .28em; color: var(--blue); margin-bottom: 14px; }
#cap .title { font: 800 60px/1.08 Inter; letter-spacing: -.025em; }
#cap .sub { font: 400 30px/1.35 Inter; color: var(--muted); margin-top: 14px; }
#cap.center { left: 0; width: 1920px; top: 390px; text-align: center; }
#cap.center .title { font-size: 84px; }
#cap.hero { left: 0; width: 1920px; top: 360px; text-align: center; }
#cap.hero .title { font-size: 180px; font-weight: 900; letter-spacing: -.045em; color: #fff; text-shadow: 0 0 60px rgba(77,171,247,.45); }
#cap.hero .title .w:last-child { color: #6cbcff; }
#cap.hero .sub { font-size: 40px; margin-top: 10px; }
#cap.alert .title { font-size: 96px; color: var(--red); letter-spacing: .02em; text-transform: uppercase; }
#cap .w { display: inline-block; white-space: pre; }
.k { display: inline-block; padding: 0 .28em; border-radius: .22em; color: #fff; font-weight: 800; }

.bits { font: 700 104px "JetBrains Mono", monospace; letter-spacing: .06em; white-space: nowrap; }
.bits span { display: inline-block; }

/* controls */
#controls { width: 100%; max-width: var(--vw); height: 44px; flex: none; display: flex; align-items: flex-start; gap: 14px; padding: 2px 4px 0; color: #8a93a6; font-size: 13px; }
#controls button { background: none; border: 0; color: #8a93a6; font-size: 20px; line-height: 22px; padding: 0; cursor: pointer; width: 32px; }
#bar { position: relative; flex: 1; height: 22px; cursor: pointer; }
#bar .track { position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: #2a3148; border-radius: 2px; }
#bar .fill { position: absolute; left: 0; top: 9px; height: 4px; background: var(--blue); border-radius: 2px; }
#bar .tick { position: absolute; top: 5px; width: 2px; height: 12px; background: #56607a; }
#bar .tick span { position: absolute; top: 14px; left: 4px; white-space: nowrap; font-size: 11px; color: #7c869d; }
#time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; line-height: 22px; }
#big { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
#big div { width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,.12); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center; font-size: 48px; padding-left: 8px; border: 1px solid rgba(255,255,255,.25); }
</style>
</head>
<body>
<div id="player">
  <div id="viewport">
    <div id="stage">
      <canvas id="bg" width="1920" height="1080"></canvas>
      <svg id="world" viewBox="0 0 1920 1080"><g id="cam"></g></svg>
      <svg id="overlay" viewBox="0 0 1920 1080"></svg>
      <div id="actors"></div>
      <div id="cap"></div>
    </div>
    <div id="big"><div>▶</div></div>
  </div>
  <div id="controls">
    <button id="pp">▶</button>
    <div id="bar"><div class="track"></div><div class="fill"></div></div>
    <span id="time">0:00 / 0:00</span>
  </div>
</div>

<script>
// ============================================================================
// Inside ECFP4: a scripted explainer. Everything on screen is a pure function
// of the time t, so the timeline can be scrubbed (and later captured frame by
// frame). Identifiers and hash values are illustrative, not RDKit's.
// ============================================================================
// Embedded (the ECFPMovie widget): the widget draws the control bar in the host page and talks to
// this page with postMessage, so the frame holds only the 16:9 video.
const EMBED = window.parent !== window;
const CTRL_H = EMBED ? 0 : 50; // control bar + gap under the video
const W = 1920, H = 1080, STORY_END = 99.4;
// real time → story time: the intro cuts straight to the molecule, the unfolded scene runs slower
// tempo per scene (story seconds per real second); the intro jumps straight to the molecule
const PLAN = [
  { s0: 0, s1: 2.3, rate: 2.2 },       // title card, about a second
  { s0: 10.0, s1: 14.2, rate: 2.5 },   // molecule draws in
  { s0: 14.2, s1: 30.9, rate: 1.1 },   // atom invariants
  { s0: 30.9, s1: 50.9, rate: 0.95 },
  { s0: 50.9, s1: 53.7, rate: 3.0 },   // skip the empty beat before radius 2
  { s0: 53.7, s1: 64.8, rate: 0.95 },  // radius 1 and 2
  { s0: 64.8, s1: 66.2, rate: 1.1 },
  { s0: 66.2, s1: 71.2, rate: 1.25 },  // unfolded cards
  { s0: 71.2, s1: 76.0, rate: 1.1 },   // folding
  { s0: 76.0, s1: 79.0, rate: 4.0 },   // (nothing happens here any more)
  { s0: 79.0, s1: 86.4, rate: 1.1 },   // collision, bit vector
  { s0: 86.4, s1: 96.0, rate: 1.0 },   // Tanimoto
  { s0: 96.0, s1: STORY_END, rate: 1.3 },
];
let _r = 0;
const SEGS = PLAN.map((p) => { const g = { r0: _r, s0: p.s0, rate: p.rate }; _r += (p.s1 - p.s0) / p.rate; return g; });
const T_END = _r;
const story = (r) => { let g = SEGS[0]; for (const x of SEGS) if (r >= x.r0) g = x; return g.s0 + (r - g.r0) * g.rate; };
const real = (s) => { let g = SEGS[0]; for (const x of SEGS) if (s >= x.s0) g = x; return g.r0 + (s - g.s0) / g.rate; };

// ---------- easing / timing helpers ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, x) => a + (b - a) * x;
const E = {
  out: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  inOut: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
  back: (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
};
// 0 → 1 → 0 window with fades
const win = (t, a, b, fi = 0.4, fo = 0.4) => Math.min(E.out(P(t, a, a + fi)), 1 - E.out(P(t, b - fo, b)));
// keyframes: [[t, {…numbers}], …], eased between consecutive frames
function kf(frames, t) {
  if (t <= frames[0][0]) return { ...frames[0][1] };
  for (let i = 1; i < frames.length; i++) {
    const [t1, v1] = frames[i], [t0, v0] = frames[i - 1];
    if (t < t1) { const x = E.inOut(P(t, t0, t1)); const o = {}; for (const k in v1) o[k] = lerp(v0[k], v1[k], x); return o; }
  }
  return { ...frames[frames.length - 1][1] };
}

// ---------- the molecule (world coordinates) ----------
const ATOMS = [
  { el: "C", text: "CH₃", x: 660, y: 600, dir: 1 },
  { el: "C", text: "C", x: 860, y: 480, dir: 1 },
  { el: "O", text: "O", x: 860, y: 268, dir: -1 },
  { el: "N", text: "NH", x: 1060, y: 600, dir: 1 },
  { el: "C", text: "CH₃", x: 1260, y: 480, dir: 1 },
];
const BONDS = [[0, 1, 1], [1, 2, 2], [1, 3, 1], [3, 4, 1]];
function dist(c) {
  const d = ATOMS.map(() => Infinity); d[c] = 0; const q = [c];
  while (q.length) { const u = q.shift(); for (const [i, j] of BONDS) for (const [x, y] of [[i, j], [j, i]]) if (x === u && d[y] > d[u] + 1) { d[y] = d[u] + 1; q.push(y); } }
  return d;
}
function env(c, r) {
  const d = dist(c);
  const bonds = new Set(BONDS.map((b, n) => (Math.min(d[b[0]], d[b[1]]) < r ? n : -1)).filter((n) => n >= 0));
  const atoms = new Set([c]); for (const n of bonds) { atoms.add(BONDS[n][0]); atoms.add(BONDS[n][1]); }
  return { atoms, bonds };
}

// ---------- identifiers ----------
const COL = { a: "#8b5cf6", b: "#3b82f6", c: "#f97316", d: "#10b981", e: "#ec4899", f: "#6366f1",
  g: "#f59e0b", h: "#22c55e", i: "#e11d48", j: "#a855f7", k: "#06b6d4", l: "#64748b", m: "#64748b", n: "#64748b", o: "#64748b" };
// real RDKit Morgan identifiers for CC(=O)NC, radius 2 (rdFingerprintGenerator, RDKit 2026.03)
const IDS = { a: 2246728737, b: 2246699815, c: 864942730, d: 847961216, e: 3545365497, f: 411967733,
  g: 1510328189, h: 828793177, i: 3824063894, j: 88780136 };
const ID = (k) => IDS[k];
const BIT = Object.fromEntries(Object.entries(IDS).map(([k, v]) => [k, v % 16]));
const fmt = (n) => n.toLocaleString("en-US");
const KEYS = "abcdefghij".split("");

// ---------- camera ----------
const CAM = [
  [0, { cx: 960, cy: 430, s: 1 }], [14.2, { cx: 960, cy: 430, s: 1 }],
  [15.4, { cx: 1066, cy: 470, s: 1.55 }], [20.6, { cx: 1066, cy: 470, s: 1.55 }],
  [21.8, { cx: 960, cy: 430, s: 1 }], [31.0, { cx: 960, cy: 430, s: 1 }],
  [32.2, { cx: 1000, cy: 380, s: 1.3 }], [40.3, { cx: 1000, cy: 380, s: 1.3 }],
  [41.3, { cx: 960, cy: 430, s: 1 }], [66.0, { cx: 960, cy: 430, s: 1 }],
  [67.6, { cx: 960, cy: 330, s: 0.8 }], [79.0, { cx: 960, cy: 330, s: 0.8 }],
  [80.2, { cx: 233, cy: 900, s: 0.55 }],
];
const WORLD_O = [[0, { o: 1 }], [65.8, { o: 1 }], [67.2, { o: 0.07 }], [79.0, { o: 0.07 }], [80.0, { o: 1 }], [86.0, { o: 1 }], [87.0, { o: 0 }]];
const toScreen = (x, y, c) => [W / 2 + (x - c.cx) * c.s, H / 2 + (y - c.cy) * c.s];
const labelWorld = (a) => [ATOMS[a].x, ATOMS[a].y + ATOMS[a].dir * 84];
const badgeWorld = (a) => (ATOMS[a].dir < 0 ? [ATOMS[a].x + 76, ATOMS[a].y - 84] : [ATOMS[a].x, ATOMS[a].y + ATOMS[a].dir * 158]);
const labelScreen = (a, t) => { const c = kf(CAM, t); return [...toScreen(...labelWorld(a), c), Math.pow(c.s, 0.6)]; };
const badgeScreen = (a, t) => { const c = kf(CAM, t); return [...toScreen(...badgeWorld(a), c), Math.pow(c.s, 0.6)]; };

// ---------- storyboard data ----------
const CAPS = [
  { t0: 0.1, t1: 2.3, style: "hero", title: "Inside ECFP4", sub: "How a molecule becomes a bit vector" },
  { t0: 10.2, t1: 14.1, title: "N-methylacetamide", sub: "CC(=O)NC" },
  { t0: 14.3, t1: 20.7, tag: "01 · RADIUS 0", title: "Six numbers per atom", sub: "…hashed into one integer: the atom's identifier." },
  { t0: 21.0, t1: 25.3, tag: "01 · RADIUS 0", title: "Every atom gets one", sub: "Different properties, different identifiers." },
  { t0: 25.5, t1: 28.9, tag: "01 · RADIUS 0", title: "Same six numbers, same identifier", sub: "Both methyls are simply [a] — for now." },
  { t0: 29.0, t1: 30.7, tag: "01 · RADIUS 0", title: "Collect them in a set", sub: "[a] is stored once, however often it occurs." },
  { t0: 30.9, t1: 40.5, tag: "02 · RADIUS 1", title: "Look one bond further", sub: "Own identifier + sorted (bond, neighbour) pairs → hash." },
  { t0: 40.7, t1: 47.0, tag: "02 · RADIUS 1", title: "Every atom does the same", sub: "Using the old identifiers — then all update together." },
  { t0: 47.2, t1: 50.8, tag: "02 · RADIUS 1", title: "Now the methyls differ", sub: "One sits next to C=O, the other next to N." },
  { t0: 51.0, t1: 56.1, tag: "03 · RADIUS 2", title: "Neighbours of neighbours", sub: "Each identifier now covers a bigger substructure." },
  { t0: 56.2, t1: 64.6, tag: "03 · RADIUS 2", title: "Seen these bonds before? Drop it.", sub: "An environment that covers the same bonds as an earlier one is a duplicate." },
  { t0: 64.8, t1: 71.0, title: "The unfolded ECFP4", sub: "10 unique substructures, each a 32-bit integer (real RDKit values)." },
  { t0: 71.2, t1: 79.0, tag: "04 · FOLDING", title: "Squeeze into a fixed length", sub: "bit = identifier mod 16   (mod 2048 in practice)" },
  { t0: 79.2, t1: 82.7, style: "alert", title: "Collision", sub: "CH₃–C and C–NH–C: different substructures, same bit 9." },
  { t0: 82.9, t1: 86.4, title: "This is all the model sees", sub: "No counts. No positions. No way to undo a collision." },
  { t0: 86.5, t1: 88.6, tag: "05 · SIMILARITY", title: "Now take a second molecule", sub: "N-ethylacetamide, CC(=O)NCC: one carbon longer." },
  { t0: 88.7, t1: 91.5, tag: "05 · SIMILARITY", title: "Tanimoto similarity", sub: "bits on in both ÷ bits on in either" },
  { t0: 91.6, t1: 93.5, tag: "05 · SIMILARITY", title: "Very similar — or is it?", sub: "Short vectors mean more collisions, and collisions inflate similarity." },
  { t0: 93.6, t1: 96.0, tag: "05 · SIMILARITY", title: "Bits 6 and 8 match by accident", sub: "Different substructures in A and B. With 2048 bits, Tanimoto drops to 0.41." },
];
const CHAPTERS = [[0, "Intro"], [14.3, "Radius 0"], [30.9, "Radius 1"], [51, "Radius 2"], [64.8, "Unfolded"], [71.2, "Folding"], [86.4, "Similarity"], [96.0, "Outro"]];

// label events per atom: [time, key, fx]
const LABEL = [
  [[20.25, "a", "none"], [45.5, "e", "flip"]],
  [[22.4, "b", "pop"], [45.7, "f", "flip"]],
  [[23.2, "c", "pop"], [45.9, "g", "flip"]],
  [[24.0, "d", "pop"], [46.1, "h", "flip"]],
  [[26.0, "a", "pop"], [46.3, "i", "flip"]],
];
// "next" badges: atom, key, show, hide
const BADGES = [
  [1, "f", 39.6, 45.7, 0], [0, "e", 41.8, 45.5], [2, "g", 42.6, 45.9], [3, "h", 43.4, 46.1], [4, "i", 44.2, 46.3],
  [3, "j", 55.0, 64.8], [0, "l", 57.0, 58.2], [2, "m", 59.0, 60.6], [1, "n", 61.2, 62.6], [4, "o", 63.2, 64.6],
];
const STAMPS = [[6, 57.6, "= f"], [7, 59.6, "= f"], [8, 61.7, "= j"], [9, 63.7, "= h"]];
// highlighted environments: centre, radius, t0, t1, red?
const ENV = [
  [0, 0, 14.8, 20.6], [1, 0, 22.2, 22.9], [2, 0, 23.0, 23.7], [3, 0, 23.8, 24.5], [0, 0, 25.8, 28.8], [4, 0, 25.8, 28.8],
  [1, 1, 31.6, 40.2], [0, 1, 41.4, 42.3], [2, 1, 42.2, 43.1], [3, 1, 43.0, 43.9], [4, 1, 43.8, 44.7],
  [0, 1, 47.2, 50.4], [4, 1, 47.2, 50.4],
  [3, 2, 54.0, 56.2], [0, 2, 56.2, 58.2], [2, 2, 58.2, 60.6], [1, 2, 60.6, 62.6], [4, 2, 62.6, 64.6],
  [0, 1, 79.8, 82.8, 1], [3, 1, 79.8, 82.8, 1],
].map(([c, r, t0, t1, red]) => ({ c, r, t0, t1, red: !!red, e: env(c, r), d: dist(c) }));
// features flying into the tray: key → [start, source]
const FLY = {
  a: [29.0, "L0"], b: [29.2, "L1"], c: [29.4, "L2"], d: [29.6, "L3"],
  e: [49.6, "L0"], f: [49.8, "L1"], g: [50.0, "L2"], h: [50.2, "L3"], i: [50.4, "L4"],
  j: [64.8, "B3"],
};
// dim everything except these atoms (and bonds between them)
const DIM = [[15.0, 20.7, [0]], [31.4, 40.3, [0, 1, 2, 3]]];
const INV = [["Atomic number", "6"], ["Degree (incl. H)", "4"], ["Hydrogens", "3"], ["Charge", "0"], ["Isotope", "0"], ["In a ring", "no"]];
// the first identifier drops alone (with its mod callout), the rest fall almost together
const dropT = (i) => 74.0 + i * 0.07;

// ---------- build DOM ----------
const $ = (s) => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const S = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; };
const D = (html, cls = "") => { const e = document.createElement("div"); e.className = "a " + cls; e.innerHTML = html; $("#actors").appendChild(e); return e; };
const chipHTML = (k, extra = "") => `<div class="chip ${extra}" style="background:linear-gradient(160deg, ${COL[k]}, ${shade(COL[k])});--glow:${COL[k]}88">${k}</div>`;
function shade(hex) { const n = parseInt(hex.slice(1), 16); const f = (v) => Math.round(v * 0.62); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; }
function place(el, x, y, s = 1, o = 1, extra = "") {
  if (o <= 0.002) { if (el.style.display !== "none") el.style.display = "none"; return; }
  if (el.style.display === "none") el.style.display = "";
  el.style.opacity = o;
  el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%) scale(${s}) ${extra}`;
}

// world svg
const cam = $("#cam");
const defs = S("defs", {}, $("#world"));
defs.innerHTML = `<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  <radialGradient id="atomfill" cx="40%" cy="35%"><stop offset="0" stop-color="#23304f"/><stop offset="1" stop-color="#121a2d"/></radialGradient>`;
const ringEls = ENV.map(() => S("circle", { fill: "none", "stroke-width": 3, "stroke-dasharray": "10 12" }, cam));
// translucent "reach" blob per environment: grows outward bond by bond, so its size is the radius

    for (const at of w.e.atoms) atomA[at] = Math.max(atomA[at], a * P(t, w.t0 + Math.max(0, w.d[at] - 1) * 0.4 + (w.d[at] ? 0.3 : 0), w.t0 + 0.3 + Math.max(0, w.d[at] - 1) * 0.4 + (w.d[at] ? 0.3 : 0)));
    centerA[w.c] = Math.max(centerA[w.c], a);
    if (w.red) atomA[w.c] = Math.max(atomA[w.c], a), (atomEls[w.c].red = 1);
  });
  glowEls.forEach((g, n) => { g.setAttribute("stroke", bondRed[n] ? "#ff5d5d" : "#ffb547"); g.setAttribute("stroke-opacity", bondA[n] * 0.7); });
  atomEls.forEach((ae, n) => {
    const p = E.back(P(t, 10.9 + n * 0.16, 11.5 + n * 0.16)); const a = ATOMS[n];
    ae.g.setAttribute("transform", `translate(${a.x} ${a.y}) scale(${Math.max(0, p)}) translate(${-a.x} ${-a.y})`);
    const red = ENV.some((w) => w.red && w.e.atoms.has(n) && t > w.t0 && t < w.t1);
    ae.halo.setAttribute("stroke", red ? "#ff5d5d" : centerA[n] >= atomA[n] ? "#4dabf7" : "#ffb547");
    ae.halo.setAttribute("stroke-width", 8 * atomA[n]);
    ae.halo.setAttribute("stroke-opacity", atomA[n]);
    ae.c.setAttribute("stroke", centerA[n] > 0.3 ? "#6cbcff" : "#3a4a74");
    ae.g.style.opacity = 1 - 0.85 * dimOf(t, n);
  });
  bondEls.forEach((b, n) => { const [i, j] = BONDS[n]; b.g.style.opacity = 1 - 0.85 * Math.max(dimOf(t, i), dimOf(t, j)); });

  // atom labels
  labelEls.forEach((el, a) => {
    const st = labelState(a, t);
    if (!st) return place(el, 0, 0, 1, 0);

    const [x, y, s] = labelScreen(a, t);
    place(el, x, y, s * st.s, wo * (1 - 0.85 * dimOf(t, a)) * (1 - P(t, 65.8, 66.6)), `scaleX(${st.sx})`);
  });
  // badges
  BADGES.forEach(([a, k, t0, t1], n) => {
    const el = badgeEls[n];
    if (t < t0 || t >= t1) return place(el, 0, 0, 1, 0);
    const [x, y, s] = badgeScreen(a, t);
    const grey = !"abcdefghij".includes(k);
    const fade = grey ? 1 - P(t, t1 - 0.35, t1) : 1;
    const drop = grey ? E.in(P(t, t1 - 0.35, t1)) * 40 : 0;

  });
  STAMPS.forEach(([b, t0], n) => {
    const [a, , , t1] = BADGES[b]; const el = stampEls[n];
    if (t < t0 || t >= t1) return place(el, 0, 0, 1, 0);
    const [x, y, s] = badgeScreen(a, t); const q = E.out(P(t, t0, t0 + 0.25));
    place(el, x + 170 * s, y, s * lerp(2.4, 1, q), q * (1 - P(t, t1 - 0.35, t1)), "rotate(-9deg)");
  });

  // invariant cards (screen space, around the zoomed CH3)
  const c1 = labelScreen(0, t);
  const atomS = toScreen(ATOMS[0].x, ATOMS[0].y, c);
  INV.forEach((_, n) => {
    const t0 = 15.6 + n * 0.22, tx = 1100, ty = 300 + n * 92;
    const p = E.out(P(t, t0, t0 + 0.6)), q = E.in(P(t, 18.5 + n * 0.06, 19.2 + n * 0.06));
    let x = lerp(atomS[0], tx, p), y = lerp(atomS[1], ty, p);
    x = lerp(x, 1640, q); y = lerp(y, 530, q);
    place(cardEls[n], x, y, lerp(0.3, 1, p) * (1 - 0.8 * q), p * (1 - q));
  });
  // hash icon
  const h1 = win(t, 18.2, 20.4, 0.3, 0.3), h2 = win(t, 36.9, 39.1, 0.3, 0.3);
  const hx = h1 > 0 ? [1640, 530] : [1770, 520];
  const pulse = 1 + 0.08 * Math.sin(t * 18) * (h1 || h2);
  place(hashEl, hx[0], hx[1], Math.max(h1, h2) * pulse, Math.max(h1, h2), `rotate(${t * 90}deg)`);
  hashEl.querySelector("span").style.transform = `rotate(${-t * 90}deg)`;
  // output chip of the invariant hash: flies to C1's label
  if (t >= 19.5 && t < 20.25) {
    const q = E.inOut(P(t, 19.6, 20.25));
    if (labelEls[0].dataset.key !== "a") { labelEls[0].innerHTML = chipHTML("a"); labelEls[0].dataset.key = "a"; }
    place(labelEls[0], lerp(1640, c1[0], q), lerp(530, c1[1], q) - Math.sin(Math.PI * q) * 120, lerp(1.3, c1[2], q) * E.back(P(t, 19.5, 19.8)), 1);
  }

  // radius-1 formula for the carbonyl carbon
  const fo = 1 - P(t, 37.3, 37.9);
  const slotX = (i) => 1350 + i * 150, FY = 520;
  {
    const [sx, sy, ss] = labelScreen(1, t);
    const p = E.inOut(P(t, 33.0, 33.6)), q = E.in(P(t, 37.2, 37.9));
    let x = lerp(sx, 1190, p), y = lerp(sy, FY, p) - Math.sin(Math.PI * p) * 80;
    place(ownEl, lerp(x, 1770, q), lerp(y, FY, q), lerp(ss, 1.3, p) * (1 - 0.7 * q), t >= 33.0 ? fo : 0);
    place(plusEl, 1262, FY, 1, win(t, 33.6, 37.6, 0.3, 0.3));
  }
  PAIRS.forEach(([, k], n) => {
    const src = { c: 2, a: 0, d: 3 }[k], t0 = 33.8 + n * 0.6;
    const [sx, sy] = labelScreen(src, t);
    const p = E.inOut(P(t, t0, t0 + 0.6));
    let x = lerp(sx, slotX(n), p), y = lerp(sy, FY, p) - Math.sin(Math.PI * p) * 90;
    const r = E.inOut(P(t, 36.0, 36.9));
    x = lerp(x, slotX(SORTED[n]), r); y -= Math.sin(Math.PI * r) * (SORTED[n] > n ? 110 : -70);
    const q = E.in(P(t, 37.2, 37.9));
    x = lerp(x, 1770, q); y = lerp(y, FY, q);
    place(pairEls[n], x, y, lerp(0.6, 1, p) * (1 - 0.7 * q), t >= t0 ? fo : 0);
  });
  if (t >= 38.5 && t < 39.6) {
    const [bx, by, bs] = badgeScreen(1, t); const q = E.inOut(P(t, 38.9, 39.6));
    place(fOut, lerp(1770, bx, q), lerp(520, by, q) - Math.sin(Math.PI * q) * 140, lerp(1.4, bs * 0.9, q) * E.back(P(t, 38.5, 38.85)), 1);
  } else place(fOut, 0, 0, 1, 0);

  // feature tray
  const L = kf(TRAY, t);
  const trayDim = 1 - 0.8 * win(t, 31.0, 40.8, 0.6, 0.6);
  place(trayLbl, W / 2 - 4.5 * L.sp - 150, L.y, 1, win(t, 29.0, 66.0, 0.5, 0.5) * trayDim);
  KEYS.forEach((k, i) => {
    const el = trayEls[i], [tf, from] = FLY[k];
    if (t < tf) return place(el, 0, 0, 1, 0);
    const [tx, ty, ts] = trayPos(i, t);
    const td = dropT(i);
    let x, y, s, o = 1;
    if (t < tf + 0.9) {
      const [sx, sy, ss] = src(from, tf); const p = E.inOut(P(t, tf, tf + 0.9));
      x = lerp(sx, tx, p); y = lerp(sy, ty, p) - Math.sin(Math.PI * p) * 150; s = lerp(ss, ts, p) * (1 + 0.2 * Math.sin(Math.PI * p));
    } else if (t < td) { x = tx; y = ty; s = ts * (1 + 0.15 * Math.sin(Math.PI * P(t, tf + 0.9, tf + 1.2))); o = trayDim; }
    else {

      x = lerp(tx, bx, E.out(p)); y = lerp(ty, by + stackOff(k), E.in(p)); s = lerp(ts, 0.62, p);
      const land = P(t, td + 0.6, td + 0.9); if (land > 0 && land < 1) s *= 1 + 0.2 * Math.sin(Math.PI * land);

      o = 1 - P(t, 82.9 + BIT[k] * 0.05, 83.3 + BIT[k] * 0.05);
    }

  });

  if (t >= 29.1 && t < 30.1) {
    const [sx, sy, ss] = labelScreen(4, 29.1); const [tx, ty, ts] = trayPos(0, t); const p = E.inOut(P(t, 29.1, 30.0));
    place(aGhost, lerp(sx, tx, p), lerp(sy, ty, p) - Math.sin(Math.PI * p) * 220, lerp(ss, ts, p), 1 - P(t, 29.8, 30.05));
  } else place(aGhost, 0, 0, 1, 0);

  });
  // collision connectors
  [0, 3].forEach((a, n) => {
    const p = conn[n]; const o = win(t, 79.9, 82.8, 0.2, 0.3);

    const [ax, ay] = toScreen(ATOMS[a].x, ATOMS[a].y + 60, c); const [bx, by] = slotPos(COLLIDE);

  place(outroSub, W / 2, 590, 1, E.out(P(t, 97.0, 97.6)));

    const col = colEls[b].firstChild;
    col.style.borderColor = red > 0.05 ? "#ff5d5d" : both ? "#34d399" : "#4dabf7";

    col.style.boxShadow = red > 0.05 ? `0 0 ${36 * red}px rgba(255,93,93,.6)` : both ? "0 0 24px rgba(52,211,153,.25)" : "none";
    col.style.height = `${(ROW_B - yA + 130) / 0.85}px`;
    place(colEls[b], x, (yA + ROW_B) / 2, 0.85 * Math.max(0, on) * (1 + 0.06 * red * Math.sin(t * 12)), Math.min(1, on) * simOut);
  }
  place(counters, 0, 0, 1, 0); place(defFormula, 0, 0, 1, 0); place(formula, 0, 0, 1, 0);
  const fq = E.back(P(t, 88.7, 89.2)), fvis = Math.min(1, fq) * simOut;
  const midY = (yA + ROW_B) / 2;
  place(fLabel, TX - 290, TY, Math.max(0, fq), fvis);
  place(fBar, TX, TY, Math.max(0, fq), fvis);
  const flyDot = (el, b, t0, ty) => {
    const p = P(t, t0, t0 + 0.55);

  const tG = (k) => 89.2 + k * 0.13, tB = (k) => 90.5 + k * 0.09;
  INTER.forEach((b, k) => flyDot(dotG[k], b, tG(k), TY - 52));
  UNION.forEach((b, k) => flyDot(dotB[k], b, tB(k), TY + 52));
  const nG = INTER.filter((_, k) => t >= tG(k) + 0.55).length, nB = UNION.filter((_, k) => t >= tB(k) + 0.55).length;
  const numTxt = nG ? String(nG) : "|A ∩ B|", denTxt = nB ? String(nB) : "|A ∪ B|";
  if (fNum.firstChild.textContent !== numTxt) fNum.firstChild.textContent = numTxt;
  if (fDen.firstChild.textContent !== denTxt) fDen.firstChild.textContent = denTxt;
  const bump = (n, tt) => (n ? 1 + 0.25 * (1 - P(t, tt(n - 1) + 0.55, tt(n - 1) + 0.8)) : 1);
  place(fNum, TX, TY - 50, Math.max(0, fq) * bump(nG, tG), fvis);
  place(fDen, TX, TY + 52, Math.max(0, fq) * bump(nB, tB), fvis);

  place(fRes, TX + 270, TY, Math.max(0, rq), Math.min(1, rq) * simOut);
  const f2 = E.back(P(t, 94.4, 94.9));
  place(formula2, 1640, TY, Math.max(0, f2), Math.min(1, f2) * simOut);
  place(molA, 230, yA - 10, 1, E.out(P(t, 86.8, 87.3)) * simOut);

// ---------- player ----------
let t = 0, playing = false, last = 0, lastPost = 0, drawn = null;
const vp = $("#viewport"), stage = $("#stage");
if (EMBED) { $("#controls").style.display = "none"; vp.style.borderRadius = "0"; }
function fit() {
  const k = Math.min(innerWidth / W, (innerHeight - CTRL_H) / H);
  vp.style.width = `${W * k}px`; vp.style.height = `${H * k}px`; stage.style.transform = `scale(${k})`;
  document.documentElement.style.setProperty("--vw", `${W * k}px`);
}
addEventListener("resize", fit); fit();
const bar = $("#bar");
CHAPTERS.forEach(([ct, name]) => { const d = document.createElement("div"); d.className = "tick"; d.style.left = `${(real(ct) / T_END) * 100}%`; d.innerHTML = `<span>${name}</span>`; bar.appendChild(d); });
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function frame(now) {
  if (playing) { t += (now - last) / 1000; if (t >= T_END) { t = T_END; setPlay(false); } }
  last = now;
  const shown = t === 0 && !playing ? 1.2 : story(t); // poster frame: the title card
  if (shown !== drawn) { // a paused movie draws nothing: a frame costs most of a CPU core
    drawn = shown;
    render(shown);
    bar.querySelector(".fill").style.width = `${(t / T_END) * 100}%`;
    $("#time").textContent = `${mmss(t)} / ${mmss(T_END)}`;
  }
  if (EMBED && now - lastPost > 60) {
    lastPost = now;
    parent.postMessage({ type: "ecfp-movie", t, end: T_END, playing, chapters: CHAPTERS.map(([ct, n]) => [real(ct), n]) }, "*");
  }
  requestAnimationFrame(frame);
}
function setPlay(v) { playing = v; if (v && t >= T_END) t = 0; $("#pp").textContent = v ? "❚❚" : "▶"; $("#big").style.display = v ? "none" : "flex"; }
$("#pp").onclick = () => setPlay(!playing);
$("#big").onclick = () => setPlay(true);
// while playing, the big button is hidden and a click on the picture pauses
$("#stage").onclick = () => setPlay(false);
function seekFrom(ev) { const r = bar.getBoundingClientRect(); t = clamp((ev.clientX - r.left) / r.width) * T_END; }
bar.addEventListener("pointerdown", (ev) => { seekFrom(ev); const mv = (e) => seekFrom(e); addEventListener("pointermove", mv); addEventListener("pointerup", () => removeEventListener("pointermove", mv), { once: true }); });
addEventListener("keydown", (ev) => {
  if (ev.key === " ") { ev.preventDefault(); setPlay(!playing); }
  if (ev.key === "ArrowRight") t = Math.min(T_END, t + 2);
  if (ev.key === "ArrowLeft") t = Math.max(0, t - 2);
});
addEventListener("message", (ev) => {
  const m = ev.data;
  if (!m || m.type !== "ecfp-movie-cmd") return;
  if (m.cmd === "toggle") setPlay(!playing);
  if (m.cmd === "seek") t = clamp(+m.t, 0, T_END);
});
window.seek = (s) => { t = real(s); drawn = s; render(s); }; // takes story time
const q = new URLSearchParams(location.search).get("t"); if (q) t = +q;
document.fonts?.ready.then(() => { drawn = null; }); // the canvas text is drawn again in the loaded font
requestAnimationFrame((n) => { last = n; frame(n); });
</script>
